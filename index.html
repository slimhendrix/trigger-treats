<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Trigger Treats</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    @font-face {
      font-family: 'GingerFont';
      src: url('gingerfont.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'GingerFontBold';
      src: url('gingerfontbold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --border: #e0e0e0;
      --text: #111111;
      --muted: #999999;
      --accent: #e02020;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 1.5rem) 1.25rem env(safe-area-inset-bottom, 1.5rem);
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      max-width: 390px;
      padding: 1.5rem 0 1.75rem;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-top {
      line-height: 1;
    }

    .logo-word1 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #111;
      text-transform: uppercase;
    }

    .logo-word2 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #111;
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #111;
      margin-top: 0.5rem;
      border-top: 2px solid #111;
      padding-top: 0.35rem;
      width: 100%;
      text-align: center;
    }

    /* ── SAVINGS CARD ── */
    .card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-amount {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
    }

    .card-sub {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .card-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 1.25rem;
      overflow: hidden;
    }

    .card-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      min-width: 4px;
    }

    /* ── TYPEWRITER BUBBLE ── */
    .bubble {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border: none;
      padding: 0.5rem 0.5rem;
      margin-bottom: 1.25rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      color: #111;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
    }

    .bubble .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #111;
      margin-left: 2px;
      vertical-align: text-bottom;
      opacity: 0;
    }

    .bubble.typing .cursor,
    .bubble.done .cursor {
      opacity: 1;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── BUTTON ── */
    .buttons-row {
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: center;
      padding: 2rem 0 2rem;
    }

    .round-btn {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(
        from 120deg,
        #f0f0f0 0deg, #fff 15deg, #fff 30deg,
        #b0b0b0 65deg, #606060 110deg, #484848 130deg,
        #909090 160deg, #fff 190deg, #fff 210deg,
        #d8d8d8 245deg, #606060 290deg, #f0f0f0 360deg
      );
      box-shadow:
        inset 0 4px 6px rgba(255,255,255,1),
        inset 0 -4px 6px rgba(0,0,0,0.45);
      transition: transform 0.08s, box-shadow 0.08s;
      padding: 18px;
    }

    /* Glossy black dome */
    .round-btn::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%,
        #ffffff  0%,
        #e8e8e8  5%,
        #383838 18%,
        #080808 38%,
        #000000 60%,
        #000000 100%
      );
      box-shadow:
        inset 0 16px 48px rgba(0,0,0,0.95),
        inset 0 -8px 24px rgba(255,255,255,0.1),
        inset 0 -2px 0   rgba(255,255,255,0.28),
        0 6px 18px rgba(0,0,0,0.55);
    }

    /* Gloss blob */
    .round-btn::after {
      content: '';
      position: absolute;
      width: 110px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(ellipse,
        rgba(255,255,255,1)   0%,
        rgba(255,255,255,0.7) 25%,
        rgba(255,255,255,0.2) 60%,
        rgba(255,255,255,0)   100%
      );
      top: 28px;
      left: 42px;
      pointer-events: none;
      z-index: 2;
      transition: top 0.08s;
    }

    .round-btn:active,
    .round-btn.pressed {
      transform: translateY(4px) scale(0.97);
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,0,0,0.3);
    }
    .round-btn:active::after,
    .round-btn.pressed::after { top: 38px; }

    /* Button label */
    .btn-main {
      position: relative;
      z-index: 3;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 14px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,1);
      pointer-events: none;
      text-align: center;
      padding: 0 1rem;
    }


    /* Button wrapper — lets the ring SVG overflow */
    .btn-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Circular ring label */
    .btn-ring-text {
      position: absolute;
      width: 320px;
      height: 320px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }
    .btn-ring-text text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #bbb;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── SWEAR STATE on button label ── */
    .btn-main.swearing {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* ── CARD PAYOFF FLASH ── */
    @keyframes cardFlash {
      0%   { border-color: var(--border); box-shadow: none; }
      30%  { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.25); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    .card.flash {
      animation: cardFlash 0.6s ease-out forwards;
    }

    /* ── AMOUNT ROLLOVER ── */
    @keyframes rollUp {
      0%   { opacity: 1; transform: translateY(0); }
      40%  { opacity: 0; transform: translateY(-0.6em); }
      41%  { opacity: 0; transform: translateY(0.6em); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card-amount.rolling {
      animation: rollUp 0.35s ease-in-out forwards;
    }

    .btn-caption {
      width: 100%;
      max-width: 390px;
      text-align: center;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.5;
      padding: 0.75rem 0 0.5rem;
    }

    /* ── FOOTER ── */
    .footer {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.65rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .reset-btn:hover { color: var(--accent); }

    .tagline {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 0 1rem;
    }

  </style>
</head>
<body>
  <!-- SVG filter for pencil/hand-drawn text roughness -->
  <svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="buttons-row">
    <div class="btn-wrap">
      <button class="round-btn" id="roundBtn" onclick="handleTrigger(event)">
        <span class="btn-main" id="btnLabel">PRESS HERE</span>
      </button>

    </div>
  </div>

  <div class="bubble" id="bubble">
    <span id="bubbleText"></span><span class="cursor"></span>
  </div>

  <div class="card">
    <div class="card-label">Trigger Bucks</div>
    <div class="card-amount" id="amount">$0</div>
    <div class="card-sub" id="count">No triggers yet</div>
    <div class="card-bar">
      <div class="card-bar-fill" id="bar" style="width:4px"></div>
    </div>
  </div>

  <div class="footer">
    <p class="tagline">Give yourself $1 every time somebody makes you mad. Then get yourself a little something. You need a treat.</p>
    <p class="tagline" style="margin-top:1.25rem"><button class="reset-btn" onclick="resetFund()">RESET COUNTER</button></p>
  </div>

  <script>
// Responses loaded from responses.txt — edit that file to change them
    var RESPONSES = [];

fetch('responses.txt')
      .then(function(r) { return r.text(); })
      .then(function(text) {
        RESPONSES = text
          .split('\n')
          .map(function(l) { return l.replace(/^"|"$/g, '').trim(); })
          .filter(function(l) { return l.length > 0 && l.toLowerCase() !== 'responses'; });
      })
      .catch(function() {
        RESPONSES = ["It's not you. I swear.", "Nope.", "They just shouldn't."];
      });

    // ─────────────────────────────────────────────

    var total = parseInt(localStorage.getItem('triggered_total') || '0');
    var count = parseInt(localStorage.getItem('triggered_count') || '0');

    function save() {
      localStorage.setItem('triggered_total', total);
      localStorage.setItem('triggered_count', count);
    }

    function renderCount() {
      document.getElementById('count').textContent =
        count === 0 ? 'No triggers yet' :
        count === 1 ? '1 fool, $1 saved' :
        count + ' fools, $' + total + ' saved';
      var barPct = Math.min(100, 4 + count * 3);
      document.getElementById('bar').style.width = barPct + '%';
    }

    function render() {
      document.getElementById('amount').textContent = '$' + total;
      renderCount();
    }

    function payoff() {
      // Roll the amount
      var amountEl = document.getElementById('amount');
      var card = document.querySelector('.card');
      amountEl.classList.remove('rolling');
      void amountEl.offsetWidth; // reflow to restart animation
      amountEl.classList.add('rolling');
      amountEl.addEventListener('animationend', function onEnd() {
        amountEl.removeEventListener('animationend', onEnd);
        amountEl.textContent = '$' + total;
        amountEl.classList.remove('rolling');
        renderCount();
      });
      // Flash the card border
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
      card.addEventListener('animationend', function onEnd() {
        card.removeEventListener('animationend', onEnd);
        card.classList.remove('flash');
      });
    }

    // ── TYPEWRITER SOUND ──
    var audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function clack() {
      try {
        var ctx = getAudioCtx();
        var now = ctx.currentTime;

        // — Click: bandpass-filtered noise burst (the mechanism snap) —
        var clickBuf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
        var clickData = clickBuf.getChannelData(0);
        for (var i = 0; i < clickData.length; i++) {
          clickData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (clickData.length * 0.06));
        }
        var clickSrc = ctx.createBufferSource();
        clickSrc.buffer = clickBuf;

        var bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1800 + Math.random() * 800;
        bp.Q.value = 0.7;

        var clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.55, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        clickSrc.connect(bp);
        bp.connect(clickGain);
        clickGain.connect(ctx.destination);
        clickSrc.start(now);

        // — Thud: short low sine sweep (hammer hitting platen) —
        var osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(110 + Math.random() * 40, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.035);

        var thudGain = ctx.createGain();
        thudGain.gain.setValueAtTime(0.22, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        osc.connect(thudGain);
        thudGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);

      } catch(e) {}
    }

    var typeTimer = null;
    function typeOut(text, onDone) {
      var el = document.getElementById('bubbleText');
      var bubble = document.getElementById('bubble');
      bubble.classList.add('typing');
      el.textContent = '';
      var i = 0;
      clearInterval(typeTimer);
      typeTimer = setInterval(function() {
        el.textContent += text[i];
        if (text[i] !== ' ') clack();
        i++;
        if (i >= text.length) {
          clearInterval(typeTimer);
          bubble.classList.remove('typing');
          if (onDone) onDone();
        }
      }, 55);
    }

    // ── SWEAR ──
    var SWEARS = [
      '@#$%!', '!*@#$', '#@!%*', '$#@!!',
      '@!!#$', '!#@$%', '*@#$!', '#$@!*',
    ];

    var busy = false;
    function handleTrigger(e) {
      if (busy) return;
      busy = true;

      var btn   = e.currentTarget;
      var label = document.getElementById('btnLabel');

      // 1. Press animation
      btn.classList.add('pressed');
      setTimeout(function() { btn.classList.remove('pressed'); }, 400);

      // 2. Swap label to swear (regular Courier, no bold)
      label.textContent = SWEARS[Math.floor(Math.random() * SWEARS.length)];
      label.classList.add('swearing');

      // 3. Beat — swear stays on button, then fire typewriter (swear remains)
      setTimeout(function() {
        total += 1;
        count += 1;
        save();

        var msg = RESPONSES.length > 0
          ? RESPONSES[Math.floor(Math.random() * RESPONSES.length)]
          : null;

        function finish() {
          // payoff (card flash + balance roll)
          payoff();

          // keep cursor blinking for 5 cycles (5 × 800ms)
          var bubble = document.getElementById('bubble');
          bubble.classList.add('done');
          setTimeout(function() {
            bubble.classList.remove('done');
            busy = false;
          }, 5 * 800);
        }

        if (msg) {
          typeOut(msg, finish);
        } else {
          finish();
        }
      }, 750);
    }

    function resetFund() {
      if (!confirm('Reset your treat fund to $0?')) return;
      total = 0; count = 0;
      save();
      clearInterval(typeTimer);
      document.getElementById('bubbleText').textContent = '';
      document.getElementById('bubble').classList.remove('typing');
      render();
    }

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
