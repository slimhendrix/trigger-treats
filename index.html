<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Trigger Treats</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" href="gingerfont.ttf" as="font" type="font/truetype" crossorigin>
  <link rel="preload" href="gingerfontbold.ttf" as="font" type="font/truetype" crossorigin>
  <style>
    @font-face {
      font-family: 'GingerFont';
      src: url('gingerfont.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'GingerFontBold';
      src: url('gingerfontbold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --border: #e0e0e0;
      --text: #111111;
      --muted: #999999;
      --accent: #e02020;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 1.5rem) 1.25rem env(safe-area-inset-bottom, 1.5rem);
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      max-width: 390px;
      padding: 1.5rem 0 1.75rem;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-top {
      line-height: 1;
    }

    .logo-word1 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #111;
      text-transform: uppercase;
    }

    .logo-word2 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #111;
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #111;
      margin-top: 0.5rem;
      border-top: 2px solid #111;
      padding-top: 0.35rem;
      width: 100%;
      text-align: center;
    }

    /* ── SAVINGS CARD ── */
    .card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
    }

    .card-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .card-amount {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
    }

    .card-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .card-bar {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.75rem;
      overflow: hidden;
    }

    .card-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      min-width: 4px;
    }

    /* ── HAMBURGER ── */
    .hamburger-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hamburger-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--muted);
      border-radius: 2px;
      transition: all 0.2s;
    }

    /* ── SLIDE-DOWN MENU ── */
    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 150;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 3.5rem 1.5rem 1.25rem;
      transform: translateY(-100%);
      transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .menu-panel.open {
      transform: translateY(0);
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .menu-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .threshold-row {
      display: flex;
      gap: 0.4rem;
    }

    .threshold-btn {
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .threshold-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    .menu-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 140;
    }

    .menu-backdrop.open { display: block; }

    /* ── CELEBRATION MODAL ── */
    .celebrate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .celebrate-overlay.show {
      display: flex;
    }

    .celebrate-emoji {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .celebrate-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .celebrate-msg {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 280px;
      margin-bottom: 2rem;
    }

    /* ── WHY MODAL ── */
    .why-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.95);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .why-overlay.show { display: flex; }

    .why-title {
      font-family: 'Futura', 'Century Gothic', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: rgba(224,32,32,0.6);
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
    }

    .why-msg {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 2rem;
    }

    .celebrate-close {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 0.75rem 2rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    /* ── TYPEWRITER BUBBLE ── */
    .bubble {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border: none;
      padding: 0.5rem 0.5rem;
      margin-bottom: 1.25rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      color: #111;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
    }

    .bubble .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #111;
      margin-left: 2px;
      vertical-align: text-bottom;
      opacity: 0;
    }

    .bubble.typing .cursor,
    .bubble.done .cursor {
      opacity: 1;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── BUTTON ── */
    .buttons-row {
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: center;
      padding: 1rem 0 0.5rem;
    }

    .round-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(
        from 120deg,
        #f0f0f0 0deg, #fff 15deg, #fff 30deg,
        #b0b0b0 65deg, #606060 110deg, #484848 130deg,
        #909090 160deg, #fff 190deg, #fff 210deg,
        #d8d8d8 245deg, #606060 290deg, #f0f0f0 360deg
      );
      box-shadow:
        inset 0 3px 5px rgba(255,255,255,1),
        inset 0 -3px 5px rgba(0,0,0,0.45);
      transition: transform 0.08s, box-shadow 0.08s;
      padding: 14px;
    }

    /* Glossy black dome */
    .round-btn::before {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%,
        #ffffff  0%,
        #e8e8e8  5%,
        #383838 18%,
        #080808 38%,
        #000000 60%,
        #000000 100%
      );
      box-shadow:
        inset 0 12px 36px rgba(0,0,0,0.95),
        inset 0 -6px 18px rgba(255,255,255,0.1),
        inset 0 -2px 0   rgba(255,255,255,0.28),
        0 5px 14px rgba(0,0,0,0.55);
    }

    /* Gloss blob */
    .round-btn::after {
      content: '';
      position: absolute;
      width: 82px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(ellipse,
        rgba(255,255,255,1)   0%,
        rgba(255,255,255,0.7) 25%,
        rgba(255,255,255,0.2) 60%,
        rgba(255,255,255,0)   100%
      );
      top: 21px;
      left: 31px;
      pointer-events: none;
      z-index: 2;
      transition: top 0.08s;
    }

    .round-btn:active,
    .round-btn.pressed {
      transform: translateY(4px) scale(0.97);
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,0,0,0.3);
    }
    .round-btn:active::after,
    .round-btn.pressed::after { top: 29px; }

    /* Button label */
    .btn-main {
      position: relative;
      z-index: 3;
      font-family: 'GingerFontBold';
      font-size: 2.4rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 14px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,1);
      pointer-events: none;
      text-align: center;
      padding: 0 1rem;
    }


    /* Button wrapper — lets the ring SVG overflow */
    .btn-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Circular ring label */
    .btn-ring-text {
      position: absolute;
      width: 240px;
      height: 240px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }
    .btn-ring-text text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #bbb;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── FADE IN on reset ── */
    @keyframes fadeInLabel {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .btn-main.fading-in {
      animation: fadeInLabel 2s ease-out forwards;
    }

    /* ── SWEAR STATE on button label ── */
    .btn-main.swearing {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* ── CARD PAYOFF FLASH ── */
    @keyframes cardFlash {
      0%   { border-color: var(--border); box-shadow: none; }
      30%  { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.25); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    .card.flash {
      animation: cardFlash 0.6s ease-out forwards;
    }

    /* ── AMOUNT ROLLOVER ── */
    @keyframes rollUp {
      0%   { opacity: 1; transform: translateY(0); }
      40%  { opacity: 0; transform: translateY(-0.6em); }
      41%  { opacity: 0; transform: translateY(0.6em); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card-amount.rolling {
      animation: rollUp 0.35s ease-in-out forwards;
    }

    .btn-caption {
      width: 100%;
      max-width: 390px;
      text-align: center;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.5;
      padding: 0.75rem 0 0.5rem;
    }

    /* ── FOOTER ── */
    .footer {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .reset-btn:hover { color: var(--accent); }

    .tagline {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
      padding: 0 1rem;
    }

  </style>
</head>
<body>
  <!-- SVG filter for pencil/hand-drawn text roughness -->
  <svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="footer" style="padding-top:1rem; padding-bottom:0;">
    <p class="tagline" style="font-family:'Futura','Century Gothic',sans-serif; font-weight:700; color:rgba(224,32,32,0.6); font-size:1.55rem; letter-spacing:0.28em; margin-bottom:0; text-align:left; width:100%;">TRIGGER TREATS</p>
    <p class="tagline" style="margin-top:0.07rem; margin-bottom:0.5rem;">Give yourself $1 every time somebody makes you mad. Then get yourself a little something. You need a treat.</p>
  </div>

  <div class="buttons-row">
    <div class="btn-wrap">
      <button class="round-btn" id="roundBtn" onclick="handleTrigger(event)">
        <span class="btn-main" id="btnLabel">PRESS<br>HERE</span>
      </button>

    </div>
  </div>

  <div class="bubble" id="bubble">
    <span id="bubbleText"></span><span class="cursor"></span>
  </div>

  <div class="card">
    <div class="card-label">Trigger Bucks</div>
    <div class="card-amount" id="amount">$0</div>
    <div class="card-sub" id="count">No triggers yet</div>
    <div class="card-bar">
      <div class="card-bar-fill" id="bar" style="width:4px"></div>
    </div>
  </div>

  <div class="footer">
    <p class="tagline" style="margin-top:1.25rem"><button class="reset-btn" id="resetBtn" onclick="resetFund()">RESET COUNTER</button></p>
  </div>

  <!-- Hamburger -->
  <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <!-- Slide-down menu -->
  <div class="menu-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>
  <div class="menu-panel" id="menuPanel">
    <div class="menu-row">
      <span class="menu-label">Set your Treat Trigger</span>
      <div class="threshold-row">
        <button class="threshold-btn" onclick="setThreshold(25)">$25</button>
        <button class="threshold-btn" onclick="setThreshold(50)">$50</button>
        <button class="threshold-btn" onclick="setThreshold(75)">$75</button>
      </div>
    </div>
  </div>

  <!-- Why modal -->
  <div class="why-overlay" id="whyOverlay" onclick="closeWhy()">
    <div class="why-title">TRIGGER TREATS</div>
    <div class="why-msg">Do something special with your rage.</div>
    <button class="celebrate-close" onclick="closeWhy()">GOT IT</button>
  </div>

  <!-- Celebration modal -->
  <div class="celebrate-overlay" id="celebrateOverlay">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-title">Treat time.</div>
    <div class="celebrate-msg" id="celebrateMsg"></div>
    <button class="celebrate-close" onclick="closeCelebration()">GO GET YOUR TREAT</button>
  </div>

  <script>
    var RESPONSES = [
      "There There. Sorry everyone's dumber than you.",
      "People are so dumb. I swear.",
      "Feel free to throw something.",
      "They can fuck right off.",
      "Good lord people are lame.",
      "At least you're smarter than them.",
      "Sorry if you got mansplained. The pain is real.",
      "You said it better. I promise you.",
      "Everyone needs to just.",
      "Everything about this says time to go to a yoga retreat but just skip the yoga.",
      "Sorry they're not as smart as you.",
      "Yes, you are right, they're asswipes.",
      "Holy lord people are dumber than dirt.",
      "At least you're better looking.",
      "Pick a different word for lame with every letter of their name.",
      "They just shouldn't.",
      "None of us get it. It's not you.",
      "Try not to slap anyone today.",
      "Picture them late for class.",
      "Hawkeye had it right. Beer on cornflakes",
      "Try not to go Daisy Duke on their ass.",
      "A Haiku: Lame people won't leave / They're everywhere, man, I swear. / Can they all just go.",
      "A Haiku: If only dummies / Could see what they do to me. / It could be a show.",
      "Try not to make anyone cry today if you can swing it. It's hard though. I know.",
      "A Haiku: May turds find their shoes / And never stop smelling bad / Stinky dumb lamos.",
      "No words. Just the shaking of my head with you.",
      "How do they have their jobs. It is very unclear to us at this time.",
      "If only we were in charge of all the things.",
      "This is why people just ditch it all and go to Tibet.",
      "Someone put all the stupid people into a breakout room that I do not have permissions to enter.",
      "Press 1 if you want people to just go the fuck away.",
      "Jesus take everyone else's wheel.",
      "Everyone needs to hush for a day, please. Just all ya'll: hush.",
      "A Haiku: Dumb people near me / Oh that's not a good idea / I should be in charge."
    ];

    var RESPONSE_DECK = [];

    function shuffled(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    var lastResponse = null;
    function nextResponse() {
      if (RESPONSE_DECK.length === 0) {
        RESPONSE_DECK = shuffled(RESPONSES);
        if (RESPONSE_DECK.length > 1 && RESPONSE_DECK[RESPONSE_DECK.length - 1] === lastResponse) {
          var swap = Math.floor(Math.random() * (RESPONSE_DECK.length - 1));
          var tmp = RESPONSE_DECK[swap];
          RESPONSE_DECK[swap] = RESPONSE_DECK[RESPONSE_DECK.length - 1];
          RESPONSE_DECK[RESPONSE_DECK.length - 1] = tmp;
        }
      }
      lastResponse = RESPONSE_DECK.pop();
      return lastResponse;
    }

    RESPONSE_DECK = shuffled(RESPONSES);

    // ─────────────────────────────────────────────

    var total = parseInt(localStorage.getItem('triggered_total') || '0');
    var count = parseInt(localStorage.getItem('triggered_count') || '0');
    var threshold = parseInt(localStorage.getItem('triggered_threshold') || '0');
    var celebrated = parseInt(localStorage.getItem('triggered_celebrated') || '0');

    function save() {
      localStorage.setItem('triggered_total', total);
      localStorage.setItem('triggered_count', count);
    }

    // ── THRESHOLD ──
    function setThreshold(val) {
      threshold = val;
      localStorage.setItem('triggered_threshold', val);
      renderThreshold();
      closeMenu();
    }

    function renderThreshold() {
      document.querySelectorAll('.threshold-btn').forEach(function(btn) {
        btn.classList.toggle('active', parseInt(btn.textContent.replace('$','')) === threshold);
      });
    }

    function checkThreshold() {
      if (!threshold || total < threshold) return;
      if (celebrated >= threshold) return; // already celebrated this milestone
      celebrated = threshold;
      localStorage.setItem('triggered_celebrated', celebrated);
      showCelebration();
    }

    function showCelebration() {
      var msgs = {
        25:  "You've saved $25 in Trigger Bucks. That's real money. Go get yourself something nice.",
        50:  "Fifty whole dollars. Earned one frustration at a time. You deserve something good.",
        75:  "Seventy-five bucks worth of nonsense survived. Go treat yourself. You've earned every penny."
      };
      document.getElementById('celebrateMsg').textContent = msgs[threshold] || "You hit your goal. Go get your treat.";
      document.getElementById('celebrateOverlay').classList.add('show');
    }

    function closeCelebration() {
      document.getElementById('celebrateOverlay').classList.remove('show');
    }

    function renderCount() {
      document.getElementById('count').textContent =
        count === 0 ? 'No triggers yet' :
        count === 1 ? '1 fool, $1 saved' :
        count + ' fools, $' + total + ' saved';
      var barPct = threshold
        ? Math.min(100, (total / threshold) * 100)
        : Math.min(100, 4 + count * 3);
      document.getElementById('bar').style.width = barPct + '%';
    }

    function render() {
      document.getElementById('amount').textContent = '$' + total;
      renderCount();
    }

    function payoff() {
      // Roll the amount
      var amountEl = document.getElementById('amount');
      var card = document.querySelector('.card');
      amountEl.classList.remove('rolling');
      void amountEl.offsetWidth; // reflow to restart animation
      amountEl.classList.add('rolling');
      amountEl.addEventListener('animationend', function onEnd() {
        amountEl.removeEventListener('animationend', onEnd);
        amountEl.textContent = '$' + total;
        amountEl.classList.remove('rolling');
        renderCount();
      });
      // Flash the card border
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
      card.addEventListener('animationend', function onEnd() {
        card.removeEventListener('animationend', onEnd);
        card.classList.remove('flash');
        checkThreshold();
      });
    }

    // ── TYPEWRITER SOUND ──
    var audioCtx = null;
    var audioIdleTimer = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // suspend after 3s of silence
      clearTimeout(audioIdleTimer);
      audioIdleTimer = setTimeout(function() {
        if (audioCtx) audioCtx.suspend();
      }, 3000);
      return audioCtx;
    }
    function clack() {
      try {
        var ctx = getAudioCtx();
        var now = ctx.currentTime;

        // randomise volume and pitch slightly each keystroke
        var volScale  = 0.7 + Math.random() * 0.6;   // 0.7 – 1.3×
        var pitchBump = (Math.random() - 0.5) * 400;  // ±200 Hz on click centre

        // — Click: bandpass-filtered noise burst —
        var clickBuf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
        var clickData = clickBuf.getChannelData(0);
        for (var i = 0; i < clickData.length; i++) {
          clickData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (clickData.length * 0.06));
        }
        var clickSrc = ctx.createBufferSource();
        clickSrc.buffer = clickBuf;

        var bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1800 + pitchBump + Math.random() * 400;
        bp.Q.value = 0.7;

        var clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.55 * volScale, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        clickSrc.connect(bp);
        bp.connect(clickGain);
        clickGain.connect(ctx.destination);
        clickSrc.start(now);

        // — Tick: crisp mid sine sweep —
        var baseFreq = 280 + Math.random() * 60;      // 280 – 340 Hz start → half
        var osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.025);

        var thudGain = ctx.createGain();
        thudGain.gain.setValueAtTime(0.22 * volScale, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        osc.connect(thudGain);
        thudGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);

      } catch(e) {}
    }

    function platen() {
      try {
        var ctx = getAudioCtx();
        var now = ctx.currentTime;

        // soft low thump — heavier than a key, like the carriage nudging forward
        var osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(90 + Math.random() * 20, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);

        var gain = ctx.createGain();
        gain.gain.setValueAtTime(0.18 + Math.random() * 0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        // add a tiny noise puff for the mechanical feel
        var nBuf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
        var nData = nBuf.getChannelData(0);
        for (var i = 0; i < nData.length; i++) {
          nData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nData.length * 0.2));
        }
        var nSrc = ctx.createBufferSource();
        nSrc.buffer = nBuf;
        var lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 300;
        var nGain = ctx.createGain();
        nGain.gain.setValueAtTime(0.12, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        nSrc.connect(lp);
        lp.connect(nGain);
        nGain.connect(ctx.destination);
        nSrc.start(now);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);

      } catch(e) {}
    }

    var typeTimer = null;
    function typeOut(text, onDone) {
      var el = document.getElementById('bubbleText');
      var bubble = document.getElementById('bubble');
      bubble.classList.add('typing');
      el.textContent = '';
      var i = 0;
      if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }

      function typeNext() {
        el.textContent += text[i];
        if (text[i] === ' ') platen(); else clack();
        i++;
        if (i >= text.length) {
          bubble.classList.remove('typing');
          if (onDone) onDone();
        } else {
          // base 55ms ± up to 25ms jitter
          var delay = 65 + Math.random() * 40;
          // slight pause after punctuation for realism
          var ch = text[i - 1];
          if (ch === '.' || ch === ',' || ch === '!' || ch === '?') delay += 80 + Math.random() * 80;
          typeTimer = setTimeout(typeNext, delay);
        }
      }
      typeNext();
    }

    // ── SWEAR ──
    var GRAWLIX_CHARS = ['@', '#', '$', '%', '&', '*', '!'];
    function randomGrawlix() {
      var len = 4 + Math.floor(Math.random() * 3); // 4–6 chars
      var result = '';
      for (var i = 0; i < len; i++) {
        result += GRAWLIX_CHARS[Math.floor(Math.random() * GRAWLIX_CHARS.length)];
      }
      if (result.indexOf('!') === -1) {
        var pos = Math.floor(Math.random() * len);
        result = result.substring(0, pos) + '!' + result.substring(pos + 1);
      }
      return result;
    }

    var busy = false;
    function handleTrigger(e) {
      if (busy) return;
      busy = true;

      var btn   = e.currentTarget;
      var label = document.getElementById('btnLabel');

      // 1. Press animation
      btn.classList.add('pressed');
      setTimeout(function() { btn.classList.remove('pressed'); }, 400);

      // 2. Swap label to swear (regular Courier, no bold)
      label.textContent = randomGrawlix();
      label.classList.add('swearing');

      // 3. Beat — swear stays on button, then fire typewriter (swear remains)
      setTimeout(function() {
        total += 1;
        count += 1;
        save();

        var msg = RESPONSES.length > 0 ? nextResponse() : null;

        function finish() {
          // payoff (card flash + balance roll)
          payoff();

          // keep cursor blinking for 5 cycles (5 × 800ms)
          var bubble = document.getElementById('bubble');
          bubble.classList.add('done');
          setTimeout(function() {
            bubble.classList.remove('done');
            label.innerHTML = 'PRESS<br>HERE';
            label.classList.remove('swearing');
            label.classList.remove('fading-in');
            void label.offsetWidth; // reflow to restart animation
            label.classList.add('fading-in');
            busy = false;
          }, 5 * 800);
        }

        if (msg) {
          typeOut(msg, finish);
        } else {
          finish();
        }
      }, 750);
    }

    var resetPending = false;
    var resetTimeout = null;

    function resetFund() {
      var btn = document.getElementById('resetBtn');
      if (!resetPending) {
        resetPending = true;
        btn.textContent = 'For sure?';
        resetTimeout = setTimeout(function() {
          resetPending = false;
          btn.textContent = 'RESET COUNTER';
        }, 3000);
        return;
      }
      clearTimeout(resetTimeout);
      resetPending = false;
      btn.textContent = 'RESET COUNTER';
      total = 0; count = 0; celebrated = 0;
      localStorage.setItem('triggered_celebrated', 0);
      save();
      if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
      document.getElementById('bubbleText').textContent = '';
      document.getElementById('bubble').classList.remove('typing');
      render();
    }

    // ── WHY MODAL ──
    function openWhy() {
      closeMenu();
      document.getElementById('whyOverlay').classList.add('show');
    }

    function closeWhy() {
      document.getElementById('whyOverlay').classList.remove('show');
    }

    // ── HAMBURGER MENU ──
    function toggleMenu() {
      var panel = document.getElementById('menuPanel');
      var backdrop = document.getElementById('menuBackdrop');
      var open = panel.classList.toggle('open');
      backdrop.classList.toggle('open', open);
    }

    function closeMenu() {
      document.getElementById('menuPanel').classList.remove('open');
      document.getElementById('menuBackdrop').classList.remove('open');
    }

    render();
    renderThreshold();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
